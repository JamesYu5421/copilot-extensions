name: Installer Darwin construction custody

on:
  pull_request:
    branches: [dev]
    paths:
      - ".github/workflows/installer-darwin-custody.yml"
      - "libs/installer-engine/installer_bootstrap.py"
      - "libs/installer-engine/installer_darwin.py"
      - "libs/installer-engine/installer_processes.py"
      - "libs/installer-engine/tests/darwin_custody_native.py"
      - "libs/agent-procutil/src/agent_procutil/**"

permissions:
  contents: read

concurrency:
  group: installer-darwin-custody-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  native-custody:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Exercise native ownership without elevated privileges or package installation
        run: python -I -B libs/installer-engine/tests/darwin_custody_native.py
