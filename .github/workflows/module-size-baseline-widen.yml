# Trusted-main code measures committed dev objects and proposes reviewed dev
# policy updates. It never advances main or executes the measured dev tooling.
name: Module size baseline widen

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  push:
    branches: [main]

concurrency:
  group: module-size-baseline-widen
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  widen:
    name: prepare reviewed dev baseline update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: main-promotion
    # workflow_run uses default-branch control, never a selectable dev YAML.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'dev' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion != 'cancelled'))
    env:
      BASELINE_BRANCH: automation/module-size-baseline-dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pin committed dev data and the previous proposal
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh auth setup-git
          git fetch --no-tags origin refs/heads/dev:refs/remotes/origin/dev
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            git merge-base --is-ancestor "$EVENT_SHA" origin/dev
          fi
          echo "sha=$(git rev-parse origin/dev)" >> "$GITHUB_OUTPUT"
          remote=$(git ls-remote --heads origin "refs/heads/$BASELINE_BRANCH")
          previous=""
          if [ -n "$remote" ]; then
            read -r previous _ <<< "$remote"
            git fetch --no-tags origin "$previous"
          fi
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
      - name: Prepare using trusted policy and inert source blobs
        id: prepare
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          PREVIOUS_SHA: ${{ steps.source.outputs.previous }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          args=(--source "$SOURCE_SHA")
          if [ -n "$PREVIOUS_SHA" ]; then args+=(--previous "$PREVIOUS_SHA"); fi
          python tools/prepare_module_baseline.py "${args[@]}" > "$RUNNER_TEMP/module-baseline.json"
          echo "changed=$(jq -r .changed "$RUNNER_TEMP/module-baseline.json")" >> "$GITHUB_OUTPUT"
      - name: Publish a reviewed dev proposal with an exact branch lease
        if: steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.APERTURE_RELEASE_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          gh auth setup-git
          remote=$(git ls-remote --heads origin refs/heads/dev)
          read -r latest _ <<< "$remote"
          if [ "$latest" != "$SOURCE_SHA" ]; then
            echo "::error::dev advanced after measurement; refusing stale baseline publication."
            exit 1
          fi
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BASELINE_BRANCH" --state open --json number,baseRefName,isDraft,headRefOid,isCrossRepository,autoMergeRequest)
          if jq -e 'any(.[]; .autoMergeRequest != null)' <<< "$prs" >/dev/null; then
            echo "::error::Existing baseline proposal has auto-merge armed; refusing unattended updates."
            exit 1
          fi
          if [ "$(jq length <<< "$prs")" -gt 1 ] || jq -e 'any(.[]; .baseRefName != "dev" or .isCrossRepository != false)' <<< "$prs" >/dev/null; then
            echo "::error::Existing baseline proposal has an unexpected PR identity."
            exit 1
          fi
          commit=$(jq -r .commit_sha "$RUNNER_TEMP/module-baseline.json")
          expected=$(jq -r .expected_head "$RUNNER_TEMP/module-baseline.json")
          number=$(jq -r '.[0].number // empty' <<< "$prs")
          resume=true
          if [ -n "$number" ]; then
            if [ "$(jq -r '.[0].headRefOid' <<< "$prs")" != "$expected" ]; then
              echo "::error::Existing PR head changed after preparation; refusing publication."
              exit 1
            fi
            if [ "$(jq -r '.[0].isDraft' <<< "$prs")" = true ]; then
              resume=false
            else
              gh pr ready "$number" --repo "$GITHUB_REPOSITORY" --undo
            fi
          fi
          remote=$(git ls-remote --heads origin refs/heads/dev)
          read -r latest _ <<< "$remote"
          if [ "$latest" != "$SOURCE_SHA" ]; then
            echo "::error::dev advanced before publication; any existing proposal remains draft."
            exit 1
          fi
          if [ "$commit" != "$expected" ]; then
            git push --force-with-lease="refs/heads/$BASELINE_BRANCH:$expected" origin "$commit:refs/heads/$BASELINE_BRANCH"
          fi
          remote=$(git ls-remote --heads origin refs/heads/dev)
          read -r latest _ <<< "$remote"
          if [ "$latest" != "$SOURCE_SHA" ]; then
            echo "::error::dev advanced during publication; branch retained and any existing proposal remains draft."
            exit 1
          fi
          body=$(printf '%s\n' '*The following contribution was assisted using Copilot.*' '' \
            '## Intent' 'Refresh committed dev module-size policy without independently advancing main.' \
            '## Changes' "Baseline-only refresh measured from dev@$SOURCE_SHA using trusted-main policy." \
            '## Validation' 'New over-cap modules remain rejected; required contribution CI and review still apply. No auto-merge is enabled.' \
            '## Documentation impact' 'Policy-data-only update; no operating contract changes.')
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base dev --head "$BASELINE_BRANCH" --draft \
              --title "tools: refresh dev module-size baseline (automated)" --body "$body")
            number=${url##*/}
          fi
          remote=$(git ls-remote --heads origin refs/heads/dev)
          read -r latest _ <<< "$remote"
          branch=$(git ls-remote --heads origin "refs/heads/$BASELINE_BRANCH")
          read -r published _ <<< "$branch"
          if [ "$latest" != "$SOURCE_SHA" ] || [ "$published" != "$commit" ]; then
            echo "::error::Publication inputs changed before review admission; proposal remains draft."
            exit 1
          fi
          if [ "$resume" = true ]; then
            gh pr ready "$number" --repo "$GITHUB_REPOSITORY"
          fi
      - name: Report outcome
        run: |
          if [ "${{ steps.prepare.outputs.changed }}" = "true" ]; then
            echo "Prepared a dev-only baseline proposal for ordinary review; main was not modified."
          else
            echo "Baseline already up to date -- no PR needed."
          fi
